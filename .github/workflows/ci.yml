name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write # cache-nix-action purges old caches via the API

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 2G

      - name: Restore dotnet tools
        run: nix develop -c dotnet tool restore

      - name: Install npm dependencies
        run: nix develop -c npm ci

      - name: Format check
        run: nix develop -c npm run format:check

      - name: Test
        run: nix develop -c dotnet test

      - name: Build bundle
        run: nix develop -c npm run build
