name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write # cache-nix-action purges old caches via the API

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 2G

      - name: Restore dotnet tools
        run: nix develop -c dotnet tool restore

      - name: Cache npm downloads
        # v6, not v4: v5 moved the action onto the Node 24 runtime (runner
        # 2.327.1 or newer, which GitHub-hosted runners are) and v6 is the same
        # action rebuilt as ESM. The inputs are unchanged, so this is a runtime
        # bump and not a migration.
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: nix develop -c npm ci --no-audit --no-fund

      - name: Format check
        run: nix develop -c npm run format:check

      - name: ADR check
        run: bash scripts/adr-check.sh

      - name: Test
        run: nix develop -c dotnet test

      - name: Build bundle
        run: nix develop -c npm run build
