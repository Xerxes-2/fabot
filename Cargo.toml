[workspace]
members = ["core/base", "core/atlas", "core/exchange", "core/mv", "core/layout", "core/tactics", "core/economy", "core/fight", "core/strategy", "core/observe", "core", "sim"]
# Old commits' trees build under .scratch/, an agent's workspace under .claude/: cargo must not claim them.
exclude = [".scratch", ".claude"]

[workspace.dependencies]
screeps-game-api = "0.23.5"
serde = { version = "1", features = ["derive"] }
# Memory's keys keep their order, so its text is written back as the engine wrote it.
serde_json = { version = "1", features = ["preserve_order"] }
rustc-hash = { version = "2.1.3", default-features = false }

[package]
name = "fabot"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fabot-base = { path = "core/base" }
fabot-exchange = { path = "core/exchange", optional = true }
fabot-layout = { path = "core/layout", optional = true }
screeps-game-api.workspace = true
serde.workspace = true
serde_json.workspace = true

# The soak's node plan and the generated set's predictions, built natively.
[features]
tools = ["dep:fabot-exchange", "dep:fabot-layout", "fabot-base/tools", "fabot-layout/tools"]

[[bin]]
name = "plan"
required-features = ["tools"]

[[bin]]
name = "exchange"
required-features = ["tools"]

[lints]
workspace = true

# The F# port's habits, kept out: npm test denies clippy's warnings.
[workspace.lints.clippy]
bool_to_int_with_if = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Unit tests run 8x faster optimised, overflow checks kept; no LTO, so a
# rebuild stays a second.
[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.sim]
inherits = "release"
panic = "abort"

[target.wasm32-unknown-unknown.dependencies]
talc = "5.1.1"
fabot-core = { path = "core" }
fabot-tactics = { path = "core/tactics" }
fabot-observe = { path = "core/observe" }
js-sys = "0.3"
wasm-bindgen = "0.2"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
