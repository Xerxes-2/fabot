[package]
name = "fabot"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
screeps-game-api = "0.23.5"
wasm-bindgen = "0.2"
serde_json = { version = "1", optional = true }
rustc-hash = { version = "2.1.3", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

# The soak's node plan and the generated set's predictions, built natively.
[features]
tools = ["dep:serde_json"]

[[bin]]
name = "plan"
required-features = ["tools"]

[[bin]]
name = "exchange"
required-features = ["tools"]

# The F# port's habits, kept out: npm test denies clippy's warnings.
[lints.clippy]
bool_to_int_with_if = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_ref_mut = "warn"
redundant_closure_for_method_calls = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"

# Unit tests run 8x faster optimised, overflow checks kept; no LTO, so a
# rebuild stays a second.
[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.wasm32-unknown-unknown.dependencies]
talc = "5.1.1"
