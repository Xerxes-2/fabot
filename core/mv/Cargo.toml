[package]
name = "fabot-mv"
version = "0.1.0"
edition = "2024"
publish = false
# `tests/` is the unit suites, modules of the lib.
autotests = false

[lib]
path = "mod.rs"
doctest = false

[dependencies]
fabot-base.workspace = true
fabot-atlas.workspace = true

[dev-dependencies]
fabot-base = { workspace = true, features = ["test-support"] }
proptest.workspace = true

[lints]
workspace = true
