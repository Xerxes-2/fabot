[package]
name = "fabot-core"
version = "0.1.0"
edition = "2024"
publish = false
# `tests/` is the unit suites, a module of the lib.
autotests = false

[lib]
path = "lib.rs"

[dependencies]
fabot-base = { path = "base" }
fabot-atlas = { path = "atlas" }
fabot-exchange = { path = "exchange" }
fabot-mv = { path = "mv" }
fabot-layout = { path = "layout" }
fabot-tactics = { path = "tactics" }
screeps-game-api.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
fabot-base = { path = "base", features = ["test-support"] }

[lints]
workspace = true
