[package]
name = "fabot-core"
version = "0.1.0"
edition = "2024"
publish = false
# `tests/` is the unit suites, a module of the lib.
autotests = false

[lib]
path = "lib.rs"

[dependencies]
fabot-base = { path = "base" }
screeps-game-api.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
tools = ["fabot-base/tools"]

[dev-dependencies]
fabot-base = { path = "base", features = ["test-support"] }

[lints]
workspace = true
