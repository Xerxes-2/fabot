[package]
name = "fabot-base"
version = "0.1.0"
edition = "2024"
publish = false
# `tests/` is the unit suites, modules of the lib.
autotests = false

[lib]
path = "lib.rs"
doctest = false

[dependencies]
screeps-game-api.workspace = true
serde.workspace = true
rustc-hash.workspace = true
strum.workspace = true
enum-iterator.workspace = true
proptest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"], optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[features]
tools = []
test-support = ["dep:proptest", "dep:serde_json", "dep:miniz_oxide"]

[lints]
workspace = true
